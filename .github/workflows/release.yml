name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  TASK_X_REMOTE_TASKFILES: '1'
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Version guards
        run: |
          version_code_at() {
            git show "$1:gradle.properties" | sed -n 's/^VERSION_CODE=//p'
          }
          version_name_at() {
            git show "$1:gradle.properties" | sed -n 's/^VERSION_NAME=//p'
          }

          if ! PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null); then
            echo "No previous tag found; skipping version guards."
            exit 0
          fi

          PREV_CODE=$(version_code_at "$PREV_TAG")
          CURR_CODE=$(version_code_at "$TAG")
          if [ "$CURR_CODE" -le "$PREV_CODE" ]; then
            echo "::error::VERSION_CODE ($CURR_CODE) did not increase from previous release ($PREV_TAG: $PREV_CODE)"
            exit 1
          fi

          EXPECTED_NAME="${TAG#v}"
          CURR_NAME=$(version_name_at "$TAG")
          if [ "$CURR_NAME" != "$EXPECTED_NAME" ]; then
            echo "::error::VERSION_NAME ($CURR_NAME) does not match tag $TAG (expected $EXPECTED_NAME)"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint + unit tests
        run: task --yes check

      - name: Build debug APK
        run: task --yes build

      - name: Decode keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/clipshift-release-key.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        run: task --yes build:release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/clipshift-release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/clipshift.apk

      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          cp app/build/outputs/apk/release/clipshift.apk clipshift.apk

      - name: Determine prerelease flag
        run: |
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Create release
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --generate-notes --prerelease app-debug.apk clipshift.apk
          else
            gh release create "$TAG" --generate-notes app-debug.apk clipshift.apk
          fi
